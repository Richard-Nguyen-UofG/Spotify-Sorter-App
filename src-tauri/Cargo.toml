[package]
name = "spotify-sorter"
version = "0.1.0"
description = "Weekly Liked Songs sorter for Spotify"
edition = "2021"

[lib]
name = "spotify_sorter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros", "process", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
thiserror = "2"
url = "2"
